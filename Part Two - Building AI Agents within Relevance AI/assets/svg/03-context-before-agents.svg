<rect x="56.0" y="230.0" width="254.0" height="4.0" rx="2" fill="#4f45dc"/>
<text x="76.0" y="266.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#4f45dc" text-anchor="start" letter-spacing="1.3">SOURCE</text>
<text x="76.0" y="294.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">Email mailbox</text>
<text x="76.0" y="320.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#898781" text-anchor="start" letter-spacing="0">Microsoft Outlook</text>
<line x1="76.0" y1="338.0" x2="290.0" y2="338.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="76.0" y="362.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">Where invoices arrive. Polled</text>
<text x="76.0" y="380.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">automatically; attachments</text>
<text x="76.0" y="399.7" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">enabled.</text>
<text x="76.0" y="466.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#898781" text-anchor="start" letter-spacing="1.2">HOW IT CONNECTS</text>
<rect x="76.0" y="478.0" width="123.9" height="23.0" rx="11.5" fill="#dde4ff" stroke="#e1e0d9" stroke-width="1"/>
