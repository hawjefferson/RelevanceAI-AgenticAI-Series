<text x="96.0" y="594.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">Facts only, or stop</text>
<text x="96.0" y="622.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">Facts from the email, attachment or</text>
