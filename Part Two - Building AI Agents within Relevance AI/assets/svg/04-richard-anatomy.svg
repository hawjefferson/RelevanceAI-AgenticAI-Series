<text x="886.1" y="253.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0">No human in the loop to start it</text>
