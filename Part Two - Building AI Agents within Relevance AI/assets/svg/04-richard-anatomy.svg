<text x="80.0" y="388.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">Richard the Invoice Manager</text>
<text x="80.0" y="412.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">Monitors the invoice mailbox, identifies invoice emails, extracts invoice data, submits complete invoices to</text>
<text x="80.0" y="431.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">the homegrown invoice application, and reports results for human visibility.</text>
