<text x="237.7" y="509.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0">Temperature 0</text>
