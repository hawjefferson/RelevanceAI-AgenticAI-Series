<text x="78.0" y="266.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">Outlook mailbox, polled automatically - attachments enabled</text>
