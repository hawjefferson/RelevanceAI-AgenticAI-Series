<text x="96.0" y="688.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">Missing or ambiguous, stop and ask</text>
