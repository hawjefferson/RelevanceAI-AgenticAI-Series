<title id="t">One successful end-to-end run</title><desc id="d">A seven-step trace of a real run: Outlook trigger, classification, Mistral OCR, field extraction, validation, a 201 Created from the invoice API with the returned invoice id, and a Slack notification - 33 seconds end to end.</desc>
