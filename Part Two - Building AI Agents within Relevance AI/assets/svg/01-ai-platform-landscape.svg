<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-labelledby="t d">
<title id="t">Three shapes of AI in the market</title><desc id="d">Point solutions, embedded AI and horizontal platforms compared on what they are, examples, where each wins and where each runs out.</desc>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#c3c2b7"/>
  </marker>
  <marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#5f56ff"/>
  </marker>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5f56ff"/><stop offset="1" stop-color="#9646e5"/>
  </linearGradient>
</defs>
<rect x="0.0" y="0.0" width="1200.0" height="770.0" rx="0" fill="#fcfcfb"/>

<text x="56.0" y="64.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#5f56ff" text-anchor="start" letter-spacing="1.4">PART TWO - FIGURE 1</text>
<text x="56.0" y="98.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">The market sells AI with one paintbrush</text>
<text x="56.0" y="130.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">There are three different shapes on offer, and they fail in different places. Knowing which is which is most of the platform decision.</text>
<rect x="56.0" y="214.0" width="344.0" height="400.0" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<rect x="56.0" y="214.0" width="4.0" height="400.0" rx="2" fill="#949eff"/>
<text x="78.0" y="250.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#949eff" text-anchor="start" letter-spacing="1.4">POINT SOLUTIONS</text>
<text x="78.0" y="277.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17.5" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">One task, one industry</text>
<text x="78.0" y="306.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">Software that solves a single, specific problem</text>
<text x="78.0" y="325.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">very deeply for one vertical.</text>
<text x="78.0" y="363.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#898781" text-anchor="start" letter-spacing="1.2">EXAMPLES</text>
<rect x="78.0" y="373.1" width="230.2" height="23.0" rx="11.5" fill="#eef2ff" stroke="#e1e0d9" stroke-width="1"/>
<text x="88.0" y="388.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0c162f" text-anchor="start" letter-spacing="0">Heidi Health - clinical documentation</text>
<line x1="78.0" y1="419.1" x2="378.0" y2="419.1" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round"/>
<text x="78.0" y="441.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0ca30c" text-anchor="start" letter-spacing="1.2">WHERE IT WINS</text>
<text x="78.0" y="461.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">Fastest time to value when your use case is</text>
<text x="78.0" y="480.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">exactly the one it was built for. Nothing</text>
<text x="78.0" y="498.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">horizontal will match its depth on that job.</text>
<text x="78.0" y="537.7" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#d03b3b" text-anchor="start" letter-spacing="1.2">WHERE IT RUNS OUT</text>
<text x="78.0" y="557.7" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">The second use case. You buy another tool. Then</text>
<text x="78.0" y="576.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">another.</text>
<rect x="428.0" y="214.0" width="344.0" height="400.0" rx="12" fill="#eef2ff"/>
<rect x="428.0" y="214.0" width="4.0" height="400.0" rx="2" fill="#6e6fff"/>
<text x="450.0" y="250.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6e6fff" text-anchor="start" letter-spacing="1.4">EMBEDDED AI</text>
<text x="450.0" y="277.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17.5" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">Inside the tools you already own</text>
<text x="450.0" y="306.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">AI features shipped as part of a product already</text>
<text x="450.0" y="325.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">in your stack.</text>
<text x="450.0" y="363.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#898781" text-anchor="start" letter-spacing="1.2">EXAMPLES</text>
<rect x="450.0" y="373.1" width="96.3" height="23.0" rx="11.5" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="460.0" y="388.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0c162f" text-anchor="start" letter-spacing="0">Notion agents</text>
<rect x="553.3" y="373.1" width="91.8" height="23.0" rx="11.5" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="563.3" y="388.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0c162f" text-anchor="start" letter-spacing="0">CRM copilots</text>
<rect x="450.0" y="403.1" width="153.6" height="23.0" rx="11.5" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="460.0" y="418.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0c162f" text-anchor="start" letter-spacing="0">Helpdesk suggest-reply</text>
<line x1="450.0" y1="449.1" x2="750.0" y2="449.1" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round"/>
<text x="450.0" y="471.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0ca30c" text-anchor="start" letter-spacing="1.2">WHERE IT WINS</text>
<text x="450.0" y="491.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">No procurement, no onboarding, and the context</text>
<text x="450.0" y="510.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">is already sitting in the product.</text>
<text x="450.0" y="548.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#d03b3b" text-anchor="start" letter-spacing="1.2">WHERE IT RUNS OUT</text>
<text x="450.0" y="568.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">It can only see its own product. Anything that</text>
<text x="450.0" y="587.7" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">crosses systems is out of scope.</text>
<rect x="800.0" y="214.0" width="344.0" height="400.0" rx="12" fill="#dde4ff"/>
<rect x="800" y="214" width="344" height="400" rx="12" fill="none" stroke="#4f45dc" stroke-width="2.5"/>
<rect x="800.0" y="214.0" width="4.0" height="400.0" rx="2" fill="#4f45dc"/>
<text x="822.0" y="250.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#4f45dc" text-anchor="start" letter-spacing="1.4">HORIZONTAL PLATFORMS</text>
<text x="822.0" y="277.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17.5" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">Any use case, any business unit</text>
<text x="822.0" y="306.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">A platform you build on rather than a feature</text>
<text x="822.0" y="325.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">you switch on.</text>
<text x="822.0" y="363.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#898781" text-anchor="start" letter-spacing="1.2">EXAMPLES</text>
<rect x="822.0" y="373.1" width="92.2" height="23.0" rx="11.5" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="832.0" y="388.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0c162f" text-anchor="start" letter-spacing="0">Relevance AI</text>
<rect x="921.2" y="373.1" width="74.4" height="23.0" rx="11.5" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="931.2" y="388.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0c162f" text-anchor="start" letter-spacing="0">Wonderful</text>
<rect x="1002.6" y="373.1" width="72.2" height="23.0" rx="11.5" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="1012.6" y="388.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0c162f" text-anchor="start" letter-spacing="0">Anthropic</text>
<rect x="822.0" y="403.1" width="57.4" height="23.0" rx="11.5" fill="#ffffff" stroke="#e1e0d9" stroke-width="1"/>
<text x="832.0" y="418.8" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0c162f" text-anchor="start" letter-spacing="0">OpenAI</text>
<line x1="822.0" y1="449.1" x2="1122.0" y2="449.1" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round"/>
<text x="822.0" y="471.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0ca30c" text-anchor="start" letter-spacing="1.2">WHERE IT WINS</text>
<text x="822.0" y="491.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">One platform, many use cases, many departments.</text>
<text x="822.0" y="510.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">Work that crosses four systems is the normal</text>
<text x="822.0" y="528.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">case, not the exception.</text>
<text x="822.0" y="567.7" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#d03b3b" text-anchor="start" letter-spacing="1.2">WHERE IT RUNS OUT</text>
<text x="822.0" y="587.7" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">It will not out-depth a vertical tool on that tool's</text>
<text x="822.0" y="606.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">one job. And it asks you to build.</text>
<rect x="56.0" y="658.0" width="1088.0" height="52.0" rx="10" fill="#eef2ff"/>
<rect x="56.0" y="658.0" width="4.0" height="52.0" rx="2" fill="#5f56ff"/>
<text x="76.0" y="689.2" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#0c162f" text-anchor="start" letter-spacing="0">Most organisations end up with all three. The useful question is not which one wins - it is which layer owns which use case.</text>
</svg>
