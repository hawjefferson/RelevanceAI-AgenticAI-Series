<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="t d">
<title id="t">A strong use case and a weak one, scored against the same five criteria</title><desc id="d">Two scorecards side by side. Inbound lead qualification passes all five criteria and is a build-first candidate. Make our strategy process AI-powered fails four of five and should be declined.</desc>
