<text x="298.5" y="294.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">Kickoff</text>
<text x="298.5" y="320.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">Champion and executive</text>
<text x="298.5" y="338.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">buyer aligned on what</text>
<text x="298.5" y="356.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">success means.</text>
<line x1="298.5" y1="366.0" x2="452.5" y2="366.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/>
<text x="298.5" y="386.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#898781" text-anchor="start" letter-spacing="1.1">WHO</text>
<text x="298.5" y="401.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#52514e" text-anchor="start" letter-spacing="0">Champion + exec buyer</text>
<text x="298.5" y="454.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#898781" text-anchor="start" letter-spacing="1.1">OUTPUT</text>
<text x="298.5" y="470.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#0c162f" text-anchor="start" letter-spacing="0">Shared definition of done</text>
