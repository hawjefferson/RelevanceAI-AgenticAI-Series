<text x="76.0" y="538.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#0c162f" text-anchor="start" letter-spacing="0">Stages 03 and 04 are the ones teams skip. Skipping them is how a presales slide becomes a six-month build nobody sponsors.</text>
