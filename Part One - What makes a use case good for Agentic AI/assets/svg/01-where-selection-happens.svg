<text x="280.5" y="200.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#898781" text-anchor="start" letter-spacing="1.3">IMPLEMENTATION</text>
<line x1="280.5" y1="208.0" x2="1144.0" y2="208.0" stroke="#e1e0d9" stroke-width="2" stroke-linecap="round"/>
