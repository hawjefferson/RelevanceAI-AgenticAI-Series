<text x="972.0" y="386.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#898781" text-anchor="start" letter-spacing="1.1">WHO</text>
<text x="972.0" y="401.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#52514e" text-anchor="start" letter-spacing="0">Delivery + technical owner</text>
<text x="972.0" y="454.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#898781" text-anchor="start" letter-spacing="1.1">OUTPUT</text>
<text x="972.0" y="470.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#0c162f" text-anchor="start" letter-spacing="0">A plan with dates</text>
