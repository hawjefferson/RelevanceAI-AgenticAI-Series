<text x="224.0" y="622.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">Value &gt;= midpoint  AND  Effort &lt;= midpoint</text>
