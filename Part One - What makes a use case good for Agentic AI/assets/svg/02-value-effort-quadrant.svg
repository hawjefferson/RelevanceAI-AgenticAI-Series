<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1070" width="1200" height="1070" role="img" aria-labelledby="t d">
<title id="t">The value versus effort quadrant</title><desc id="d">A quadrant with business value rising up the y-axis and ease of delivery rising to the right, so the top-right quadrant is high value and low effort. Eight numbered example use cases are plotted and keyed below the chart.</desc>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#c3c2b7"/>
  </marker>
  <marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#5f56ff"/>
  </marker>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5f56ff"/><stop offset="1" stop-color="#9646e5"/>
  </linearGradient>
</defs>
<rect x="0.0" y="0.0" width="1200.0" height="1070.0" rx="0" fill="#fcfcfb"/>

<text x="56.0" y="64.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#5f56ff" text-anchor="start" letter-spacing="1.4">PART ONE - FIGURE 2</text>
<text x="56.0" y="98.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">Value vs effort: pick the top-right</text>
<text x="56.0" y="130.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">Note the x-axis: it runs from harder to easier, left to right. That puts high value and low effort together in the top-right corner.</text>
