<text x="212.0" y="256.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#6e6fff" text-anchor="start" letter-spacing="1.5">SEQUENCE LATER</text>
<text x="212.0" y="283.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">High value, high effort</text>
<text x="212.0" y="308.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">Worth doing. Not first - it will outrun your sponsorship.</text>
<text x="691.0" y="256.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#4f45dc" text-anchor="start" letter-spacing="1.5">BUILD FIRST</text>
<text x="691.0" y="283.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">High value, low effort</text>
<text x="691.0" y="308.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">One or two of these. This is the whole game.</text>
<text x="212.0" y="512.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#777a82" text-anchor="start" letter-spacing="1.5">DECLINE</text>
<text x="212.0" y="539.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">Low value, high effort</text>
<text x="212.0" y="564.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">Say no out loud, early, and in front of the exec buyer.</text>
<text x="691.0" y="512.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#949eff" text-anchor="start" letter-spacing="1.5">FILL CAPACITY</text>
<text x="691.0" y="539.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0c162f" text-anchor="start" letter-spacing="0">Low value, low effort</text>
<text x="691.0" y="564.0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start" letter-spacing="0">Fine once the team has slack. Never the flagship.</text>
